<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>رویدادهای بات</title>
<style>body{font-family:tahoma,sans-serif;background:#0f1520;color:#d6deeb;max-width:640px;margin:auto;padding:12px}
.e{background:#182235;border-radius:10px;padding:12px;margin:10px 0;white-space:pre-wrap;line-height:1.8}
.m{font-size:12px;color:#8aa0c0}.t{font-weight:bold;margin-bottom:4px}</style></head><body>
<h2>📡 رویدادهای بات</h2><div id="l">در حال بارگذاری…</div>
<script>
// اپ شما هم می‌تواند همین فایل را بخواند: https://raw.githubusercontent.com/<USER>/<REPO>/main/data/events.json
fetch('./events.json').then(r=>r.json()).then(a=>{
 document.getElementById('l').innerHTML=a.slice().reverse().map(e=>
 `<div class="e"><div class="m">${new Date(e.ts*1000).toLocaleString('fa-IR')} · ${e.type}${e.symbol?' · '+e.symbol:''}</div>
 <div class="t">${e.title}</div>${e.text.replace(/<[^>]+>/g,'')}</div>`).join('')||'هنوز رویدادی نیست';
}).catch(()=>{document.getElementById('l').textContent='فایل events.json پیدا نشد'});
</script></body></html>
